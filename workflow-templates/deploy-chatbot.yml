# ============================================================
# COPIAR ESTE ARCHIVO A: techo360-chatbot/.github/workflows/deploy.yml
# ============================================================
name: Deploy Techo 360 - Chatbot

on:
  push:
    branches: [development]

jobs:
  deploy-chatbot:
    runs-on: self-hosted
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Desplegar SOLO el servicio de Chatbot
        run: |
          chmod +x /opt/techo360/techo360-infra/scripts/deploy-service.sh
          /opt/techo360/techo360-infra/scripts/deploy-service.sh chatbot
