name: Deploy Techo 360 - AI Service

on:
  push:
    branches: [development]

jobs:
  deploy-ai-service:
    runs-on: self-hosted
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Desplegar SOLO el microservicio de IA
        run: |
          chmod +x /opt/techo360/techo360-infra/scripts/deploy-service.sh
          /opt/techo360/techo360-infra/scripts/deploy-service.sh ai-service
