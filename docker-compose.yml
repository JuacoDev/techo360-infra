name: techo360

# ============================================================
# Techo 360 - Orquestacion principal de contenedores
# ------------------------------------------------------------
# Red interna unica: los contenedores se hablan por nombre de
# servicio (ej. "postgres-principal", "rabbitmq"). Nada queda
# expuesto al host salvo lo estrictamente necesario.
#
# PUERTOS APROBADOS POR EL CCA (unicos habilitados hacia
# internet, fuera del campus): 22 (ssh-sftp), 80 (http),
# 443 (https), 5432 (postgresql), ademas de ping/snmp.
# Por eso backend y chatbot NO exponen puerto propio: el
# "frontend" (Nginx) hace de reverse proxy y enruta /api/ y
# /chatbot/ hacia ellos internamente, todo por el puerto 80/443.
# El puerto 5432 esta disponible si en algun momento se decide
# exponer una de las 3 bases para administracion remota directa
# (pgAdmin/DBeaver) -- de momento ninguna lo usa, ver nota en el
# servicio de base de datos que se quiera exponer.
#
# PRESUPUESTO DE RAM (VPS: 8GB, 2 cores, SIN GPU):
#   postgres-principal   512m
#   postgres-vector      512m
#   postgres-users       256m
#   redis                128m
#   rabbitmq             256m
#   backend              512m
#   chatbot              512m   (el proceso FastAPI; el LLM corre aparte, en Ollama)
#   proyeccion           512m
#   frontend             128m
#   ollama              3072m   (LLM local, CPU-only -> ver nota mas abajo)
#   ---------------------------------
#   TOTAL asignado      6400m  (~6.25GB de 8GB, deja margen para el SO)
#
# NOTA IMPORTANTE SOBRE OLLAMA: este VPS no tiene GPU. Un modelo
# de 7-8B parametros corriendo solo por CPU puede acercarse o
# superar el limite de 3072m y ademas responde lento. Usar un
# modelo pequeno (1-3B, ej. llama3.2:3b o phi3:mini) para lo que
# corra AQUI en produccion. El entrenamiento/experimentacion con
# modelos mas grandes se hace en las GPUs locales del equipo, no
# en este servidor.
# ============================================================

networks:
  techo360-net:
    driver: bridge

volumes:
  pg_principal_data:
  pg_vector_data:
  pg_users_data:
  rabbitmq_data:
  ollama_data:

services:

  # ---------------------------------------------------------------
  # Bases de datos (3 independientes, segun la arquitectura definida)
  # ---------------------------------------------------------------
  postgres-principal:
    image: postgis/postgis:16-3.4
    container_name: techo360-postgres-principal
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_PRINCIPAL_NAME}
      POSTGRES_USER: ${DB_PRINCIPAL_USER}
      POSTGRES_PASSWORD: ${DB_PRINCIPAL_PASSWORD}
    volumes:
      - pg_principal_data:/var/lib/postgresql/data
    networks:
      - techo360-net
    mem_limit: 512m
    cpus: 0.35
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PRINCIPAL_USER} -d ${DB_PRINCIPAL_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Puerto publicado SOLO en la IP privada de Tailscale (100.116.197.118),
    # nunca en 0.0.0.0 ni en la IP publica del servidor -- alcanzable
    # unicamente dentro de la red superpuesta cifrada de Tailscale, para
    # acceso remoto del DBA (pgAdmin/DBeaver). No cuenta contra el limite
    # de puertos aprobados por el CCA porque no es trafico de la interfaz
    # publica del servidor.
    ports:
      - "100.116.197.118:5432:5432"

  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: techo360-postgres-vector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_VECTOR_NAME}
      POSTGRES_USER: ${DB_VECTOR_USER}
      POSTGRES_PASSWORD: ${DB_VECTOR_PASSWORD}
    volumes:
      - pg_vector_data:/var/lib/postgresql/data
      - ./db-init/pgvector-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - techo360-net
    mem_limit: 512m
    cpus: 0.35
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_VECTOR_USER} -d ${DB_VECTOR_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Puerto publicado SOLO en la IP privada de Tailscale (100.116.197.118),
    # nunca en 0.0.0.0 ni en la IP publica del servidor -- alcanzable
    # unicamente dentro de la red superpuesta cifrada de Tailscale, para
    # acceso remoto del DBA (pgAdmin/DBeaver). No cuenta contra el limite
    # de puertos aprobados por el CCA porque no es trafico de la interfaz
    # publica del servidor.
    ports:
      - "100.116.197.118:5433:5432"

  postgres-users:
    image: postgres:16-alpine
    container_name: techo360-postgres-users
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_USERS_NAME}
      POSTGRES_USER: ${DB_USERS_USER}
      POSTGRES_PASSWORD: ${DB_USERS_PASSWORD}
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    networks:
      - techo360-net
    mem_limit: 256m
    cpus: 0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERS_USER} -d ${DB_USERS_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Puerto publicado SOLO en la IP privada de Tailscale (100.116.197.118),
    # nunca en 0.0.0.0 ni en la IP publica del servidor -- alcanzable
    # unicamente dentro de la red superpuesta cifrada de Tailscale, para
    # acceso remoto del DBA (pgAdmin/DBeaver). No cuenta contra el limite
    # de puertos aprobados por el CCA porque no es trafico de la interfaz
    # publica del servidor.
    ports:
      - "100.116.197.118:5434:5432"

  # ---------------------------------------------------------------
  # Cache / colas
  # ---------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: techo360-redis
    restart: unless-stopped
    networks:
      - techo360-net
    mem_limit: 128m
    cpus: 0.15
    # Cache + OTP, sin necesidad de volumen persistente

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: techo360-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - techo360-net
    mem_limit: 256m
    cpus: 0.2
    # rabbitmq-diagnostics ping no necesita credenciales (chequea el nodo
    # erlang, no una cuenta) -- confirmado real: sin este healthcheck, el
    # backend (depends_on: rabbitmq condition: service_started) podia
    # intentar conectar su consumer de persistencia (T-97) antes de que
    # RabbitMQ aceptara conexiones AMQP, y se caia en el arranque
    # (AMQPConnectionError, Connection refused, visto en produccion el
    # 27-sep-2026). start_period generoso porque RabbitMQ tarda mas en
    # levantar que un simple TCP listen.
    healthcheck:
      # check_port_connectivity, NO ping -- ping solo confirma que el
      # proceso Erlang esta registrado con epmd (asi lo dice el propio
      # comando: "this only checks if the OS process is running and
      # registered with epmd"), no que el listener AMQP (5672) ya
      # acepte conexiones. Con ping, el backend arrancaba "sano" segun
      # depends_on pero seguia recibiendo Connection refused en 5672
      # (confirmado real contra el VPS: rabbitmq "Healthy" y el backend
      # cayendo igual). check_port_connectivity prueba los 4 puertos
      # activos (5672 entre ellos) de verdad.
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      # timeout: 5s no alcanzaba tampoco aqui -- ~7s reales medidos con
      # `time docker exec ... check_port_connectivity` contra el VPS
      # (mismo motivo que con ping: cpus: 0.2 hace lento el nodo Erlang
      # efimero del propio comando de diagnostico, no el servicio).
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s
    # T-103 (27-sep-2026, validacion del pool de workers de laboratorio,
    # ver techo360-workers): puertos publicados SOLO en la IP privada de
    # Tailscale (100.116.197.118), mismo patron ya usado por los 3
    # Postgres -- no cuenta contra el limite de puertos aprobados por el
    # CCA porque no es trafico de la interfaz publica del servidor.
    # 5672 (AMQP): para que consumers remotos (workers de techo360-workers)
    # se conecten al broker fuera de la red Docker del VPS.
    # 15672 (management, HTTP): para administrar usuarios/permisos via la
    # API de management desde una maquina de Tailscale, sin necesitar
    # acceso SSH/docker exec al VPS.
    ports:
      - "100.116.197.118:5672:5672"
      - "100.116.197.118:15672:15672"

  # ---------------------------------------------------------------
  # LLM local (Ollama) para el Chatbot
  # ---------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: techo360-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - techo360-net
    mem_limit: 3072m
    cpus: 1.0
    # Este servidor NO tiene GPU. Si en algun momento se despliega en
    # un servidor con GPU NVIDIA, descomentar:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------------
  # Backend Principal: mapa de calor, autenticacion, actualizacion
  # automatica de datos (TerriData/DANE)
  # ---------------------------------------------------------------
  backend:
    build:
      context: ../techo360-backend
    image: techo360/backend:${TAG:-dev}
    container_name: techo360-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_PRINCIPAL_USER}:${DB_PRINCIPAL_PASSWORD}@postgres-principal:5432/${DB_PRINCIPAL_NAME}
      DATABASE_USERS_URL: postgresql://${DB_USERS_USER}:${DB_USERS_PASSWORD}@postgres-users:5432/${DB_USERS_NAME}
      # T-98/T-99/T-102 (conversaciones/mensajes del chatbot): decision
      # del usuario (26-sep-2026) de que el backend maneje TODA la
      # persistencia -- los servicios de IA (chatbot, proyeccion) solo
      # procesan solicitudes, no son dueños de su propia escritura a BD.
      # Antes SOLO chatbot tenia esta credencial (T-97) -- ver AVISO en
      # techo360-backend/core/config.py.
      DATABASE_VECTOR_URL: postgresql://${DB_VECTOR_USER}:${DB_VECTOR_PASSWORD}@postgres-vector:5432/${DB_VECTOR_NAME}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres-principal:
        condition: service_healthy
      postgres-users:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - techo360-net
    mem_limit: 512m
    cpus: 0.3
    # Sin puertos publicos: el frontend lo consume internamente por nombre
    # de servicio (proxy_pass http://backend:8000/), segun los puertos
    # aprobados por el CCA (solo 22/80/443/5432 hacia internet).

  # ---------------------------------------------------------------
  # Servicio IA - Chatbot: LLM propio (Ollama) + RAG sobre pgvector
  # ---------------------------------------------------------------
  chatbot:
    build:
      context: ../techo360-chatbot
    image: techo360/chatbot:${TAG:-dev}
    container_name: techo360-chatbot
    restart: unless-stopped
    # Rediseño T-97 (26-sep-2026): SIN env_file -- ese .env compartido
    # tiene TODAS las credenciales del proyecto (DB_VECTOR_PASSWORD,
    # DB_PRINCIPAL_PASSWORD, JWT_SECRET_KEY, etc.) y `env_file:` inyecta
    # el archivo completo al contenedor sin filtrar, sin importar que
    # variables se declaren abajo en `environment:` (hallazgo real:
    # quitar solo DATABASE_VECTOR_URL de aqui NO alcanzaba, DB_VECTOR_USER/
    # PASSWORD seguian llegando via env_file, verificado con
    # `docker exec ... env` contra el VPS). Este servicio corre en
    # maquinas de laboratorio con acceso fisico de estudiantes y no
    # debe tener NINGUNA credencial de base de datos ni de otro
    # servicio -- solo lo que se lista explicitamente abajo.
    # ${RABBITMQ_USER}/${RABBITMQ_PASSWORD} se siguen resolviendo:
    # docker compose lee .env para sustituir variables en este YAML
    # independientemente de env_file (son dos mecanismos distintos).
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      OLLAMA_URL: http://ollama:11434
      # Consumer priority (RabbitMQ nativo, x-priority) -- este contenedor
      # del VPS es el respaldo cuando ningun worker de techo360-workers
      # esta conectado. Explicito aqui (aunque coincide con el default de
      # app/rabbitmq_consumer.py) para que quede documentado junto a los
      # demas valores de despliegue, ver techo360-workers/README.md para
      # la prioridad alta que usan los workers de laboratorio.
      CHATBOT_CONSUMER_PRIORITY: "0"
    depends_on:
      rabbitmq:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - techo360-net
    mem_limit: 512m
    cpus: 0.3
    # Sin puertos publicos: mismo criterio que el backend, se consume
    # internamente via el proxy del frontend (proxy_pass http://chatbot:8000/).

  # ---------------------------------------------------------------
  # Servicio IA - Proyeccion: series de tiempo (ya no usa LightGBM,
  # ver README de techo360-proyeccion)
  # ---------------------------------------------------------------
  proyeccion:
    build:
      context: ../techo360-proyeccion
    image: techo360/proyeccion:${TAG:-dev}
    container_name: techo360-proyeccion
    restart: unless-stopped
    env_file: .env
    environment:
      # DATABASE_URL (principal, no vectorial): el consumer de RabbitMQ
      # de este servicio consulta mapcalordb/zonas_municipio para
      # construir el contexto de la proyeccion -- esos datos viven en
      # postgres-principal, no en postgres-vector. Sin esta variable el
      # consumer revienta con RuntimeError al primer mensaje.
      DATABASE_URL: postgresql://${DB_PRINCIPAL_USER}:${DB_PRINCIPAL_PASSWORD}@postgres-principal:5432/${DB_PRINCIPAL_NAME}
      DATABASE_VECTOR_URL: postgresql://${DB_VECTOR_USER}:${DB_VECTOR_PASSWORD}@postgres-vector:5432/${DB_VECTOR_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres-principal:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - techo360-net
    mem_limit: 512m
    cpus: 0.3
    # Sin puertos publicos: el frontend no la llama directo, solo via
    # RabbitMQ (a traves del backend), segun la arquitectura definida.

  # ---------------------------------------------------------------
  # Frontend (React) — sirve la SPA y ademas hace de reverse proxy
  # hacia backend/chatbot (ver nginx.conf DENTRO del repo
  # techo360-frontend), para no tener que abrir mas puertos que
  # los aprobados por el CCA (80/443)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ../techo360-frontend
      # VITE_API_URL="" es A PROPOSITO -- ruta relativa, NO un valor
      # faltante. No completar con una URL: Vite la hornea en el build,
      # y el valor vacio es lo que permite que las peticiones pasen por
      # el proxy interno de nginx (location /api/ y /auth/, ver
      # nginx.conf en techo360-frontend). Arreglado y verificado en vivo
      # en produccion el 01-sep-2026 (antes quedaba "undefined").
      args:
        VITE_API_URL: ""
    image: techo360/frontend:${TAG:-dev}
    container_name: techo360-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - chatbot
    ports:
      - "80:80"
      # - "443:443"  # descomentar cuando el CTIC entregue el DNS y haya certificado TLS
    networks:
      - techo360-net
    mem_limit: 128m
    cpus: 0.15
