name: techo360

# ============================================================
# Techo 360 - Orquestacion principal de contenedores
# ------------------------------------------------------------
# Red interna unica: los contenedores se hablan por nombre de
# servicio (ej. "postgres", "redis"). Nada queda expuesto al
# host salvo lo estrictamente necesario (frontend y backend).
# ============================================================

networks:
  techo360-net:
    driver: bridge

volumes:
  pg_data:

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: techo360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - techo360-net
    mem_limit: 1024m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No se expone puerto al host: solo accesible dentro de techo360-net

  redis:
    image: redis:7.2-alpine
    container_name: techo360-redis
    restart: unless-stopped
    networks:
      - techo360-net
    mem_limit: 128m
    cpus: 0.25
    # Cache puro, sin necesidad de volumen persistente

  backend:
    build:
      context: ../techo360-backend
    image: techo360/backend:${TAG:-dev}
    container_name: techo360-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - techo360-net
    mem_limit: 512m
    cpus: 0.5

  ai-service:
    build:
      context: ../techo360-ai-service
    image: techo360/ai-service:${TAG:-dev}
    container_name: techo360-ai-service
    restart: unless-stopped
    networks:
      - techo360-net
    mem_limit: 768m
    cpus: 0.5
    # Sin puertos publicos: el backend lo consume internamente por nombre de servicio

  frontend:
    build:
      context: ../techo360-frontend
    image: techo360/frontend:${TAG:-dev}
    container_name: techo360-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - techo360-net
    mem_limit: 128m
    cpus: 0.25
