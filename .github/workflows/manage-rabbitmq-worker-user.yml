name: Techo 360 - Crear/actualizar usuario RabbitMQ de workers

# Manual a proposito -- esto toca credenciales, no se dispara con
# cada push. Requiere el secret de repo WORKER_RABBITMQ_PASSWORD ya
# configurado (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch: {}

jobs:
  manage-worker-user:
    runs-on: self-hosted
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Crear/actualizar usuario y permisos
        env:
          WORKER_RABBITMQ_PASSWORD: ${{ secrets.WORKER_RABBITMQ_PASSWORD }}
        run: |
          chmod +x scripts/rabbitmq-worker-user.sh
          ./scripts/rabbitmq-worker-user.sh
