## Configuracion propia de Techo 360 (se monta en /etc/rabbitmq/conf.d/, despues
## del 10-defaults.conf de la imagen).
##
## Watermark de memoria ABSOLUTO. Por defecto es 0.4 de la memoria que RabbitMQ
## detecta, y dentro del contenedor detecta la del HOST (auditoria 2026-10-09:
## "computed to: 5.0137 gb" con un mem_limit de 256 MiB). Asi la alarma de memoria
## (que frena a los productores) nunca saltaba antes de que el kernel estrangulara
## 270 MiB con mem_limit de 576m (<= 50 %: Erlang puede pedir hasta el doble al
## recolectar basura). Prueba local del 09-oct con 230 MiB: reposo ~153 MiB y pico de
## ~181-195 MiB bajo 2000 x 4 KB (79-85 % del watermark, poca holgura ante una cola
## acumulada); con 270 MiB el mismo pico queda en ~67-72 %.
vm_memory_high_watermark.absolute = 270MiB
